<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Olá Mundo - Terra Girando</title>
  
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #0a001f 0%, #000814 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: min(80vmin, 420px);
      height: min(80vmin, 420px);
      text-align: center;
    }

    .earth {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: url('https://upload.wikimedia.org/wikipedia/commons/7/7f/Rotating_earth_animated_transparent.gif') center/cover no-repeat;
      box-shadow: 
        0 0 80px rgba(80, 160, 255, 0.8),
        inset 0 0 100px rgba(0, 0, 0, 0.7);
    }

    .text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #00ffff;
      font-size: clamp(2.8rem, 9vw, 5rem);
      font-weight: 900;
      letter-spacing: 5px;
      text-shadow: 
        0 0 10px #00ffff,
        0 0 30px #00ffff,
        0 0 60px #0099ff,
        0 0 100px #0044cc;
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
      animation: pulse 5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.8; filter: brightness(1); }
      to   { opacity: 1; filter: brightness(1.3); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="earth"></div>
    <div class="text">Olá Mundo</div>
  </div>
</body>
</html>
